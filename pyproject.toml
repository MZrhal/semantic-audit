[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "semantic-audit"
version = "0.2.0"
description = "Inspect declared RDF/OWL vocabularies and their directly typed individuals"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "SemanticAudit contributors"}]
keywords = ["rdf", "owl", "ontology", "knowledge-graph", "semantic-web"]
dependencies = [
    "rdflib>=7.1,<9",
]

[project.scripts]
semantic-audit = "semantic_audit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
